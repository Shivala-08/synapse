name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Download spacy model needed for extraction tests
          python -m spacy download en_core_web_sm || echo "spaCy model download skipped"

      - name: Lint check with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests
        run: |
          # Disable LLM API calls in testing by setting environment dummy vars
          export OPENAI_API_KEY="mock-key"
          export NVIDIA_API_KEY="mock-key"
          # Run tests excluding LLM test which might try to call actual APIs
          pytest -v --ignore=tests/test_llm.py
