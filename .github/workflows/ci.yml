name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Rag-eco-hackathon

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Rag-eco-hackathon/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm || echo "spaCy model download skipped"

      - name: Run unit tests
        env:
          OPENAI_API_KEY: mock-key
          NVIDIA_API_KEY_1: mock-key
        run: |
          echo "PYTHONPATH=$PYTHONPATH"
          echo "PWD=$PWD"
          ls -la
          PYTHONPATH=. pytest tests/ -v --tb=long --ignore=tests/test_llm.py 2>&1 | tail -40

  typescript-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: second-brain-agent/package-lock.json

      - name: Install agent deps
        working-directory: second-brain-agent
        run: npm ci

      - name: Type-check agent
        working-directory: second-brain-agent
        run: npx tsc --noEmit

      - name: Set up Node.js (web)
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Rag-eco-hackathon/web/package-lock.json

      - name: Install web deps
        working-directory: Rag-eco-hackathon/web
        run: |
          echo "PWD=$PWD"
          npm ci --verbose 2>&1 | tail -20

      - name: Type-check web
        working-directory: Rag-eco-hackathon/web
        run: npx tsc --noEmit -p tsconfig.ci.json
